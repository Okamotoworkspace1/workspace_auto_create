[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jigoe"
version = "0.1.0"
description = "自分の声のクローンで台本を読み上げる、動画ナレーション向け合成音声ツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jigoe contributors" }]
keywords = ["tts", "voice-clone", "japanese", "youtube", "narration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Natural Language :: Japanese",
]

# 必須依存はゼロ。標準ライブラリだけで台本解析・音声結合・字幕出力・Web UI まで動く。
dependencies = []

[project.optional-dependencies]
# クラウド系エンジン（ElevenLabs / Fish Audio）を使う場合のみ。
# 未インストールでも urllib フォールバックで動作する。
cloud = ["requests>=2.28"]
dev = ["pytest>=7"]

[project.scripts]
jigoe = "jigoe.cli:main"

[tool.setuptools.packages.find]
include = ["jigoe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
